<title>CPP Estudio</title>
<meta name="description" content="Estudio del CPP de ASIS sin conexión: resúmenes, fichas, tests y audios.">

<meta name="theme-color" content="#12151B" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-title" content="CPP">

<body>
<header id="top">
  <a id="back" class="iconbtn" href="#/" aria-label="Volver" hidden>
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <h1 id="ttl">CPP Estudio</h1>
  <span id="topx"></span>
</header>

<main id="view" tabindex="-1"><p class="loading">Cargando…</p></main>

<div id="mini" hidden>
  <button class="mini-play iconbtn" id="mPlay" aria-label="Reproducir"></button>
  <div class="mini-body">
    <a class="mini-title" id="mTitle" href="#/audios"></a>
    <input type="range" id="mSeek" min="0" max="1000" value="0" aria-label="Posición">
    <div class="mini-meta"><span id="mTime">0:00</span><span id="mDur">0:00</span></div>
  </div>
  <div class="mini-ctl">
    <button class="iconbtn sm" id="mBack" aria-label="Atrás 15 segundos">−15</button>
    <button class="iconbtn sm" id="mFwd" aria-label="Adelante 30 segundos">+30</button>
    <button class="iconbtn sm" id="mSpeed" aria-label="Velocidad">1×</button>
  </div>
</div>

<nav id="tabbar" aria-label="Secciones">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
